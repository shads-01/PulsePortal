services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: pulseportal_app
        command: sh -c "chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache && chmod -R ug+rwx /var/www/storage /var/www/bootstrap/cache && php-fpm"
        volumes:
            - ./:/var/www
        networks:
            - pulseportal

    nginx:
        image: nginx:alpine
        container_name: pulseportal_nginx
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - pulseportal

    mysql:
        image: mysql:8.0
        container_name: pulseportal_mysql
        restart: always
        environment:
            MYSQL_DATABASE: pulse_portal
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "3308:3306"
        networks:
            - pulseportal

    client:
        image: node:20
        container_name: pulseportal_client
        working_dir: /app
        volumes:
            - ./client:/app
            - /app/node_modules
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
        ports:
            - "5173:5173"
        networks:
            - pulseportal

    mailpit:
        image: axllent/mailpit
        container_name: pulseportal_mailpit
        ports:
            - "8025:8025"
            - "1025:1025"
        networks:
            - pulseportal

networks:
    pulseportal:
